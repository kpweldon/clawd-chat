<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawd Chat</title>
<link rel="icon" href="/clawd.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  color-scheme:light dark;
  --orange:#D97757; --orange-deep:#C15F3C; --orange-soft:#F6E3D9; --orange-tint:#FBF1EB;
  --bg:#FAF9F5; --side:#F3EEE6; --card:#FFFFFF; --line:#E8E1D6;
  --ink:#1F1E1D; --ink2:#5E5A54; --ink3:#948E85;
  --me:#D97757; --me-ink:#FFFFFF; --warn:#B4541B; --ok:#3F7D4E; --bad:#B3261E;
  --shadow:0 1px 2px rgba(31,30,29,.06),0 2px 8px rgba(31,30,29,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --orange-soft:#4A2C20; --orange-tint:#2E221D;
    --bg:#1F1E1D; --side:#262624; --card:#2D2C29; --line:#3A3835;
    --ink:#F2EEE8; --ink2:#C2BCB2; --ink3:#8C867C;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --orange-soft:#4A2C20; --orange-tint:#2E221D;
  --bg:#1F1E1D; --side:#262624; --card:#2D2C29; --line:#3A3835;
  --ink:#F2EEE8; --ink2:#C2BCB2; --ink3:#8C867C; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,system-ui,sans-serif;display:flex;overflow:hidden}
button{font:inherit;cursor:pointer}
.clawd{display:inline-block;width:30px;height:17px;background:url(/clawd.svg) center/contain no-repeat;flex:none}

/* ---- sidebar ---- */
#side{width:330px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 12px}
.brand b{font-size:19px;letter-spacing:-.01em}
.brand .clawd{width:38px;height:21px}
.newbtn{margin:0 14px 10px;background:var(--orange);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.newbtn:hover{background:var(--orange-deep)}
.search{margin:0 14px 10px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;outline:none}
.search input:focus{border-color:var(--orange)}
.tabs{display:flex;gap:6px;margin:0 14px 8px}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:500}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#threads{overflow-y:auto;flex:1;padding:4px 8px 16px}
.day{font-size:11.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 4px}
.t{display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;border-radius:12px;padding:10px 12px;margin:1px 0;position:relative}
.t:hover{background:rgba(217,119,87,.08)}
.t.on{background:var(--card);box-shadow:var(--shadow)}
.t .row1{display:flex;align-items:center;gap:6px}
.t .title{font-weight:600;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .when{font-size:12px;color:var(--ink3);flex:none}
.t .prev{font-size:13px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.t .meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--line);color:var(--ink2);white-space:nowrap}
.pill.work{background:var(--orange);color:#fff}
.pill.live{background:var(--orange-soft);color:var(--orange-deep)}
.pill.agents{background:transparent;border:1px solid var(--line)}
.t{cursor:pointer;padding-left:16px}
.t::after{content:"";position:absolute;left:5px;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--tc,transparent)}
.t .more{border:0;background:transparent;color:var(--ink3);font-size:16px;line-height:1;padding:2px 6px;border-radius:6px;opacity:0;flex:none}
.t:hover .more,.t.on .more{opacity:1}
.t .more:hover{background:var(--orange-tint);color:var(--orange-deep)}
.t .pin{font-size:11px;color:var(--orange-deep);flex:none}
.c-orange{--tc:#D97757}.c-red{--tc:#D9534F}.c-amber{--tc:#E0A526}.c-green{--tc:#4C9A5B}.c-teal{--tc:#2E9C9C}
.c-blue{--tc:#4A7BD0}.c-purple{--tc:#8B62C9}.c-pink{--tc:#D46A9F}.c-gray{--tc:#8C867C}
.t[class*="c-"]{background:color-mix(in srgb,var(--tc) 9%,transparent)}
.t[class*="c-"]:hover{background:color-mix(in srgb,var(--tc) 15%,transparent)}
.t.on[class*="c-"]{background:var(--card)}
#pop{position:fixed;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;width:260px;display:none}
#pop.open{display:block}
#pop label{font-size:11.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;display:block;margin:2px 0 6px}
#pop input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px 10px;font:inherit;font-size:14px;outline:none}
#pop input:focus{border-color:var(--orange)}
#pop .sw{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 12px}
#pop .sw button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;background:var(--tc);padding:0}
#pop .sw button.none{background:transparent;border:2px dashed var(--line)}
#pop .sw button.sel{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
#pop .row{display:flex;gap:8px}
#pop .row button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px;font-size:13px;font-weight:600}
#pop .row button.primary{background:var(--orange);border-color:var(--orange);color:#fff}
#pop .hint{font-size:12px;color:var(--ink3);margin:6px 0 12px}
#head h1{cursor:text}
.hbtn.pinned{background:var(--orange-tint);border-color:var(--orange);color:var(--orange-deep)}
.t.unread .title::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);margin-right:7px;vertical-align:1px}

/* ---- main ---- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#head{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--bg);min-height:64px}
#head .ht{flex:1;min-width:0}
#head h1{font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#head .sub{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.hbtn:hover{border-color:var(--orange);color:var(--orange-deep)}
.hbtn.stop{background:var(--bad);border-color:var(--bad);color:#fff}
#menu{display:none;border:0;background:transparent;font-size:22px;color:var(--ink2);padding:0 4px}
#scroll{flex:1;overflow-y:auto;padding:22px 0 10px}
#msgs{max-width:820px;margin:0 auto;padding:0 22px;display:flex;flex-direction:column;gap:12px}
.empty{margin:auto;text-align:center;color:var(--ink3);padding:60px 20px}
.empty .clawd{width:110px;height:62px;margin-bottom:18px}
.empty h2{color:var(--ink);font-size:22px;margin:0 0 6px}

.m{display:flex;gap:10px;align-items:flex-start}
.m.me{justify-content:flex-end}
.m.me .b{background:var(--me);color:var(--me-ink);border-radius:18px 18px 4px 18px;max-width:78%;padding:10px 15px;white-space:pre-wrap;word-wrap:break-word}
.m.me .b.queued{opacity:.92}
.m .av{width:34px;height:34px;border-radius:50%;background:var(--orange-tint);display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.m .av .clawd{width:24px;height:14px}
.m.cl .col{flex:0 1 auto;max-width:calc(100% - 44px)}
.m.cl .b{background:var(--card);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 16px;max-width:100%;min-width:0;box-shadow:var(--shadow);position:relative}
.topic{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange-deep);margin-bottom:4px}
.when2{font-size:11px;color:var(--ink3);margin-top:3px}
.m.me .when2{text-align:right;color:var(--ink3)}
.col{display:flex;flex-direction:column;min-width:0}
.m.me .col{align-items:flex-end;max-width:78%}
.m.me .col .b{max-width:100%}
.copy{position:absolute;top:8px;right:8px;border:0;background:transparent;color:var(--ink3);font-size:12px;opacity:0;padding:2px 6px;border-radius:6px}
.m.cl .b:hover .copy{opacity:1}
.copy:hover{background:var(--orange-tint);color:var(--orange-deep)}

/* markdown inside Claude bubbles */
.md{overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:.45em 0}
.md h1,.md h2,.md h3,.md h4{font-size:15.5px;margin:.9em 0 .3em;line-height:1.3}
.md h1{font-size:16.5px}
.md ul,.md ol{margin:.35em 0;padding-left:1.35em}
.md li{margin:.15em 0}
.md hr{border:0;border-top:1px solid var(--line);margin:.8em 0}
.md a{color:var(--orange-deep);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.md code{font:12.5px/1.4 ui-monospace,Menlo,monospace;background:var(--orange-tint);padding:1px 5px;border-radius:5px}
.md code.path{cursor:pointer;border-bottom:1px dashed var(--orange)}
.md blockquote{margin:.5em 0;padding:.1em .9em;border-left:3px solid var(--orange);color:var(--ink2)}
.md table{border-collapse:collapse;margin:.6em 0;font-size:13.5px;display:block;overflow-x:auto;max-width:100%}
.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.md th{background:var(--orange-tint)}
.md details.code{margin:.5em 0;border:1px solid var(--line);border-radius:10px}
.md details.code summary{cursor:pointer;padding:6px 11px;font-size:12.5px;color:var(--ink3);list-style:none}
.md details.code summary::before{content:"▸ ";color:var(--orange)}
.md details.code[open] summary::before{content:"▾ "}
.md details.code pre{margin:0;padding:10px 12px;overflow-x:auto;border-top:1px solid var(--line);max-height:360px}
.md details.code pre code{background:transparent;padding:0}

.work{align-self:flex-start;margin-left:44px;font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.work::before{content:"";width:14px;height:1px;background:var(--line)}
.agent{margin-left:44px;border:1px solid var(--line);border-left:4px solid var(--orange);background:var(--card);border-radius:12px;padding:10px 14px;text-align:left;color:inherit;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:560px}
.agent:hover{border-color:var(--orange)}
.agent .ai{flex:1;min-width:0}
.agent .an{font-weight:600;font-size:14px}
.agent .at{font-size:12px;color:var(--ink3)}
.agent .go{color:var(--orange-deep);font-size:13px;font-weight:600;white-space:nowrap}
.earlier{align-self:center;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:5px 14px;font-size:13px}

.typing{display:flex;gap:10px;align-items:center;margin-left:0;color:var(--ink2);font-size:13.5px}
.typing .av{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--orange);margin-right:3px;animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.errbox{border:1px solid var(--bad);color:var(--bad);background:transparent;border-radius:12px;padding:10px 14px;font-size:13.5px;margin-left:44px}

/* composer */
#compose{border-top:1px solid var(--line);background:var(--bg);padding:12px 22px 16px}
#compose .inner{max-width:820px;margin:0 auto}
.note{font-size:12.5px;color:var(--warn);margin:0 0 8px 4px}
.note.info{color:var(--ink3)}
.box{display:flex;gap:10px;align-items:flex-end;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:8px 8px 8px 16px;box-shadow:var(--shadow)}
.box:focus-within{border-color:var(--orange)}
#input{flex:1;border:0;outline:none;resize:none;background:transparent;color:var(--ink);font:inherit;line-height:1.45;max-height:220px;padding:6px 0}
#send{width:40px;height:40px;border-radius:50%;border:0;background:var(--orange);color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;flex:none}
#send:disabled{background:var(--line);color:var(--ink3);cursor:default}
#send:not(:disabled):hover{background:var(--orange-deep)}

/* agent drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .2s ease;display:flex;flex-direction:column;z-index:20}
#drawer.open{transform:none}
#drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
#drawer .dh .ht{flex:1;min-width:0}
#drawer .dh b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawer .dh span{font-size:12px;color:var(--ink3)}
#dmsgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
#dmsgs .m.me .b{background:var(--orange-soft);color:var(--ink)}
#dmsgs .label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}

@media (max-width:820px){
  #side{position:fixed;inset:0 auto 0 0;z-index:15;width:min(330px,88%);transform:translateX(-102%);transition:transform .2s}
  body.sideopen #side{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.15)}
  #menu{display:block}
  #head{padding:12px 16px}#msgs{padding:0 16px}#compose{padding:10px 16px 14px}
  .hbtn.opt{display:none}
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><span class="clawd"></span><b>Clawd Chat</b></div>
  <button class="newbtn" id="newchat">+ New chat</button>
  <div class="search"><input id="q" placeholder="Search threads" autocomplete="off"></div>
  <div class="tabs"><button data-f="all" class="on">All</button><button data-f="working">Working</button><button data-f="agents">With agents</button></div>
  <div id="threads"></div>
</aside>

<main id="main">
  <header id="head">
    <button id="menu" aria-label="Threads">☰</button>
    <div class="ht"><h1 id="htitle">Clawd Chat</h1><div class="sub" id="hsub">Pick a thread, or start a new chat</div></div>
    <button class="hbtn stop" id="stopbtn" hidden>Stop</button>
    <button class="hbtn" id="labelbtn" hidden title="Rename, colour or pin this thread">Label</button>
    <button class="hbtn" id="pinbtn" hidden>Pin</button>
    <button class="hbtn opt" id="resumebtn" hidden title="Copy the command to open this thread in a terminal">Open in terminal</button>
  </header>
  <div id="scroll"><div id="msgs"></div></div>
  <footer id="compose">
    <div class="inner">
      <p class="note" id="note" hidden></p>
      <div class="box">
        <textarea id="input" rows="1" placeholder="Message Claude…"></textarea>
        <button id="send" disabled aria-label="Send">↑</button>
      </div>
    </div>
  </footer>
</main>

<aside id="drawer">
  <div class="dh"><div class="ht"><b id="dtitle">Agent</b><span id="dsub"></span></div><button class="hbtn" id="dclose">Close</button></div>
  <div id="dmsgs"></div>
</aside>
<div class="toast" id="toast"></div>
<div id="pop"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let threads = [], current = null, thread = null, filter = 'all', showAll = false;
let pollT = null, listT = null, agentOpen = null, agentT = null, lastVersion = -1;
let seen = store.get('seen', null), firstRun = !seen;
if (!seen) seen = {};

function ago(ts){
  const s = Date.now()/1000 - ts;
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s/60) + 'm';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  const d = new Date(ts*1000);
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function clock(ts){ return new Date(ts*1000).toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'}); }
function dayLabel(ts){
  const d = new Date(ts*1000), t = new Date(); t.setHours(0,0,0,0);
  const diff = (t - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000;
  if (diff <= 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return d.toLocaleDateString(undefined, {weekday:'long'});
  return d.toLocaleDateString(undefined, {month:'long', day:'numeric'});
}
function folder(c){ return (c||'').replace(/^\/Users\/[^/]+/, '~'); }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('on'), 1800); }
async function api(path, body){
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const j = await r.json().catch(()=>({error:'bad response'}));
  if (!r.ok && !j.error) j.error = 'HTTP ' + r.status;
  return j;
}

/* ---------- markdown ---------- */
const PATH_RE = /^(~|\/Users\/|\/Volumes\/|\/Applications\/)[^\s]*$/;
function renderMd(text){
  let topic = '';
  text = text.replace(/^#\s*\*\*CLAUDE\*\*\s*[—:-]\s*(.+?)\s*\n-{3,}\s*/, (_, t) => { topic = t.replace(/\*\*/g,''); return ''; });
  let html;
  if (window.marked){
    html = marked.parse(text, {gfm:true, breaks:false});
    html = window.DOMPurify ? DOMPurify.sanitize(html) : html;
  } else {
    html = '<p>' + esc(text).replace(/\n/g, '<br>') + '</p>';
  }
  const div = document.createElement('div');
  div.className = 'md';
  div.innerHTML = html;
  div.querySelectorAll('pre').forEach(pre => {
    const lines = (pre.textContent.match(/\n/g) || []).length + 1;
    const d = document.createElement('details'); d.className = 'code';
    d.innerHTML = '<summary>Show code · ' + lines + ' line' + (lines === 1 ? '' : 's') + '</summary>';
    pre.replaceWith(d); d.appendChild(pre);
  });
  div.querySelectorAll('code').forEach(c => {
    if (!c.closest('pre') && PATH_RE.test(c.textContent.trim())) { c.classList.add('path'); c.title = 'Open'; }
  });
  div.querySelectorAll('a').forEach(a => { a.title = a.getAttribute('href') || ''; });
  return {topic, el: div};
}
document.addEventListener('click', async e => {
  const a = e.target.closest('.md a');
  if (a){
    e.preventDefault();
    const href = a.getAttribute('href') || '';
    if (/^https?:/.test(href) || href.startsWith('/') || href.startsWith('~')){
      const r = await api('/api/open', {url: href});
      toast(r.error ? r.error : 'Opening…');
    }
    return;
  }
  const c = e.target.closest('.md code.path');
  if (c){
    const r = await api('/api/open', {url: c.textContent.trim().replace(/[.,;:)]+$/, '')});
    toast(r.error ? 'Not found on this Mac' : 'Opening…');
  }
});

/* ---------- thread list ---------- */
async function loadThreads(){
  const r = await api('/api/threads');
  if (r.error) return;
  threads = r.threads;
  if (firstRun){ threads.forEach(t => seen[t.id] = t.updated); store.set('seen', seen); firstRun = false; }
  drawThreads();
}
function drawThreads(){
  const q = $('#q').value.trim().toLowerCase();
  let list = threads.filter(t =>
    (filter === 'all' || (filter === 'working' && (t.working || t.live || t.agents_running)) || (filter === 'agents' && t.agents)) &&
    (!q || (t.title + ' ' + t.preview + ' ' + t.cwd).toLowerCase().includes(q)));
  const box = $('#threads');
  if (!list.length){ box.innerHTML = '<div class="day">Nothing here</div>'; return; }
  const pinned = list.filter(t => t.pinned).sort((a, b) => a.pinned - b.pinned);
  const rest = list.filter(t => !t.pinned);
  let html = '', lastDay = '';
  for (const t of pinned.concat(rest)){
    const dl = t.pinned ? 'Pinned' : dayLabel(t.updated);
    if (dl !== lastDay){ html += '<div class="day">' + dl + '</div>'; lastDay = dl; }
    const unread = t.id !== current && t.waiting && (seen[t.id] || 0) < t.updated - 1 && (Date.now()/1000 - t.updated) < 3*86400;
    const pills = [];
    if (t.working) pills.push('<span class="pill work">Working…</span>');
    else if (t.live) pills.push('<span class="pill live">Open in terminal</span>');
    if (t.agents) pills.push('<span class="pill agents">' + t.agents + ' agent' + (t.agents>1?'s':'') + (t.agents_running ? ' · ' + t.agents_running + ' running' : '') + '</span>');
    html += '<div class="t' + (t.id === current ? ' on' : '') + (unread ? ' unread' : '') + (t.color ? ' c-' + t.color : '') + '" tabindex="0" data-id="' + t.id + '">' +
      '<div class="row1">' + (t.pinned ? '<span class="pin" title="Pinned">●</span>' : '') + '<span class="title">' + esc(t.title) + '</span><span class="when">' + ago(t.updated) + '</span><button class="more" title="Rename, colour, pin">⋯</button></div>' +
      '<div class="prev">' + esc(t.preview) + '</div>' +
      (pills.length ? '<div class="meta">' + pills.join('') + '</div>' : '') + '</div>';
  }
  box.innerHTML = html;
  const n = threads.filter(t => t.id !== current && t.waiting && (seen[t.id]||0) < t.updated - 1 && (Date.now()/1000 - t.updated) < 3*86400).length;
  document.title = (n ? '(' + n + ') ' : '') + 'Clawd Chat';
}
$('#threads').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('t')) e.target.click();
});
$('#threads').addEventListener('contextmenu', e => {
  const b = e.target.closest('.t'); if (!b) return;
  e.preventDefault(); openLabel(b.dataset.id, b);
});
$('#threads').addEventListener('click', e => {
  const b = e.target.closest('.t'); if (!b) return;
  if (e.target.closest('.more')){ e.stopPropagation(); openLabel(b.dataset.id, e.target.closest('.more')); return; }
  document.body.classList.remove('sideopen');
  openThread(b.dataset.id);
});
$('#q').addEventListener('input', drawThreads);
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  filter = b.dataset.f; drawThreads();
});
$('#menu').onclick = () => document.body.classList.toggle('sideopen');

/* ---------- one thread ---------- */
async function openThread(id){
  current = id; showAll = false; lastVersion = -1; thread = null;
  store.set('current', id);
  $('#msgs').innerHTML = '<div class="empty"><span class="clawd"></span><div>Loading…</div></div>';
  drawThreads();
  await refreshThread(true);
  $('#input').focus();
}
async function refreshThread(scrollEnd){
  if (!current) return;
  const id = current;
  const r = await api('/api/thread?id=' + encodeURIComponent(id));
  if (id !== current) return;
  if (r.error){ $('#msgs').innerHTML = '<div class="empty">Thread not found.</div>'; return; }
  const changed = r.version !== lastVersion || !thread || r.working !== thread.working || r.pending_steps !== thread.pending_steps || r.error !== thread.error;
  thread = r; lastVersion = r.version;
  const last = r.items.length ? r.items[r.items.length-1].ts : 0;
  seen[id] = Math.max(seen[id] || 0, last, Date.now()/1000); store.set('seen', seen);
  drawHead();
  if (changed) drawThread(scrollEnd);
  schedulePoll();
}
function drawHead(){
  const t = thread;
  $('#htitle').textContent = t.title;
  const status = t.working ? 'Claude is working' : t.live ? 'Open in a terminal right now' : 'Idle';
  $('#hsub').textContent = folder(t.cwd) + '  ·  ' + status;
  $('#stopbtn').hidden = !t.working;
  $('#resumebtn').hidden = false;
  $('#labelbtn').hidden = false; $('#pinbtn').hidden = false;
  $('#pinbtn').textContent = t.pinned ? 'Pinned' : 'Pin';
  $('#pinbtn').classList.toggle('pinned', !!t.pinned);
  const note = $('#note');
  if (t.live && !t.working){ note.hidden = false; note.className = 'note'; note.textContent = 'This thread is still running in a terminal. Anything you send here runs a second Claude on the same thread, so wait for the terminal to finish first.'; }
  else { note.hidden = true; }
  updateSend();
}
function nearBottom(){ const s = $('#scroll'); return s.scrollHeight - s.scrollTop - s.clientHeight < 160; }
function bubbleMe(it){
  const m = document.createElement('div'); m.className = 'm me';
  m.innerHTML = '<div class="col"><div class="b' + (it.queued ? ' queued' : '') + '"></div><div class="when2">' + clock(it.ts) + '</div></div>';
  m.querySelector('.b').textContent = it.text;
  return m;
}
function bubbleClaude(it){
  const m = document.createElement('div'); m.className = 'm cl';
  m.innerHTML = '<div class="av"><span class="clawd"></span></div><div class="col"><div class="b"><button class="copy">Copy</button></div><div class="when2">' + clock(it.ts) + '</div></div>';
  const {topic, el} = renderMd(it.text);
  const b = m.querySelector('.b');
  if (topic){ const tp = document.createElement('div'); tp.className = 'topic'; tp.textContent = topic; b.appendChild(tp); }
  b.appendChild(el);
  m.querySelector('.copy').onclick = () => { navigator.clipboard.writeText(it.text).then(()=>toast('Copied')); };
  return m;
}
function agentCard(it){
  const b = document.createElement('button'); b.className = 'agent';
  const st = it.active ? 'running now' : it.finished ? 'done' : (it.agent_id ? 'finished' : 'ran inline');
  b.innerHTML = '<span class="clawd"></span><div class="ai"><div class="an"></div><div class="at"></div></div><span class="go">' + (it.agent_id ? 'Open thread →' : '') + '</span>';
  b.querySelector('.an').textContent = it.description;
  b.querySelector('.at').textContent = 'Agent · ' + it.type + ' · ' + st;
  if (it.agent_id) b.onclick = () => openAgent(it);
  else b.disabled = true;
  return b;
}
function drawThread(scrollEnd){
  const keep = scrollEnd || nearBottom();
  const box = $('#msgs'); box.innerHTML = '';
  const items = thread.items;
  const LIMIT = 120;
  let start = 0;
  if (!showAll && items.length > LIMIT){
    start = items.length - LIMIT;
    const e = document.createElement('button'); e.className = 'earlier'; e.textContent = 'Show ' + start + ' earlier';
    e.onclick = () => { showAll = true; drawThread(false); $('#scroll').scrollTop = 0; };
    box.appendChild(e);
  }
  if (!items.length){ box.innerHTML = '<div class="empty"><span class="clawd"></span><div>No messages yet.</div></div>'; }
  for (let i = start; i < items.length; i++){
    const it = items[i];
    if (it.kind === 'user') box.appendChild(bubbleMe(it));
    else if (it.kind === 'claude') box.appendChild(bubbleClaude(it));
    else if (it.kind === 'agent') box.appendChild(agentCard(it));
    else if (it.kind === 'work'){
      const w = document.createElement('div'); w.className = 'work';
      w.textContent = 'worked · ' + it.n + ' step' + (it.n === 1 ? '' : 's');
      box.appendChild(w);
    }
  }
  if (thread.working){
    const secs = Math.max(0, Math.floor(Date.now()/1000 - thread.working_since));
    const t = document.createElement('div'); t.className = 'typing';
    t.innerHTML = '<div class="av"><span class="clawd"></span></div><span class="dots"><span></span><span></span><span></span></span><span>Working' +
      (thread.pending_steps ? ' · ' + thread.pending_steps + ' step' + (thread.pending_steps>1?'s':'') : '') + ' · ' + (secs < 60 ? secs + 's' : Math.floor(secs/60) + 'm') + '</span>';
    box.appendChild(t);
  } else if (thread.error){
    const e = document.createElement('div'); e.className = 'errbox';
    e.textContent = 'That message didn’t go through: ' + thread.error;
    box.appendChild(e);
  }
  if (keep) $('#scroll').scrollTop = $('#scroll').scrollHeight;
}
function schedulePoll(){
  clearTimeout(pollT);
  if (!thread) return;
  const ms = thread.working ? 2000 : thread.live ? 4000 : 0;
  if (ms) pollT = setTimeout(() => refreshThread(false), ms);
}
$('#stopbtn').onclick = async () => { await api('/api/stop', {id: current}); toast('Stopping…'); setTimeout(()=>refreshThread(false), 800); };
$('#resumebtn').onclick = () => {
  const cmd = 'cd "' + thread.cwd + '" && claude --resume ' + current;
  navigator.clipboard.writeText(cmd).then(()=>toast('Copied. Paste it in Terminal'));
};

/* ---------- labels: name, colour, pin ---------- */
const COLORS = ['orange','red','amber','green','teal','blue','purple','pink','gray'];
async function saveMeta(id, patch){
  const r = await api('/api/meta', Object.assign({id}, patch));
  if (r.error){ toast(r.error); return; }
  const t = threads.find(x => x.id === id);
  if (t){
    if ('title' in patch) t.title = patch.title || t.auto_title;
    if ('color' in patch) t.color = patch.color;
    if ('pinned' in patch) t.pinned = patch.pinned ? Date.now()/1000 : 0;
  }
  if (thread && id === current){
    if ('title' in patch) thread.title = patch.title || thread.auto_title;
    if ('pinned' in patch) thread.pinned = patch.pinned ? 1 : 0;
    drawHead();
  }
  drawThreads();
}
function openLabel(id, anchor){
  const t = threads.find(x => x.id === id) || (thread && thread.id === id ? thread : null);
  if (!t) return;
  const pop = $('#pop');
  pop.innerHTML = '<label>Name</label><input id="popname" maxlength="80">' +
    '<div class="hint">Auto title: ' + esc(t.auto_title || t.title) + '</div>' +
    '<label>Colour</label><div class="sw">' +
    '<button class="none' + (!t.color ? ' sel' : '') + '" data-c="" title="No colour"></button>' +
    COLORS.map(c => '<button class="c-' + c + (t.color === c ? ' sel' : '') + '" data-c="' + c + '" title="' + c + '"></button>').join('') +
    '</div><div class="row"><button id="poppin">' + (t.pinned ? 'Unpin' : 'Pin to top') + '</button><button class="primary" id="popsave">Save</button></div>';
  const name = pop.querySelector('#popname');
  name.value = t.title !== t.auto_title ? t.title : '';
  name.placeholder = t.auto_title || t.title;
  pop.querySelectorAll('.sw button').forEach(b => b.onclick = () => {
    pop.querySelectorAll('.sw button').forEach(x => x.classList.toggle('sel', x === b));
    saveMeta(id, {color: b.dataset.c});
  });
  pop.querySelector('#poppin').onclick = () => { saveMeta(id, {pinned: !t.pinned}); closeLabel(); };
  const save = () => { saveMeta(id, {title: name.value.trim()}); closeLabel(); };
  pop.querySelector('#popsave').onclick = save;
  name.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); save(); } if (e.key === 'Escape') closeLabel(); };
  const r = anchor.getBoundingClientRect();
  pop.classList.add('open');
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  pop.style.top = (r.bottom + h + 8 < innerHeight ? r.bottom + 6 : Math.max(8, r.top - h - 6)) + 'px';
  name.focus();
}
function closeLabel(){ $('#pop').classList.remove('open'); }
document.addEventListener('mousedown', e => {
  if ($('#pop').classList.contains('open') && !e.target.closest('#pop') && !e.target.closest('.more') && !e.target.closest('#labelbtn')) closeLabel();
});
$('#labelbtn').onclick = e => openLabel(current, e.currentTarget);
$('#pinbtn').onclick = () => saveMeta(current, {pinned: !thread.pinned});
$('#htitle').ondblclick = () => openLabel(current, $('#htitle'));

/* ---------- new chat ---------- */
function newChat(){
  current = null; thread = null; clearTimeout(pollT);
  store.set('current', null);
  $('#htitle').textContent = 'New chat';
  $('#hsub').textContent = 'Starts fresh in your home folder, with all your skills and memory';
  $('#stopbtn').hidden = true; $('#resumebtn').hidden = true;
  $('#labelbtn').hidden = true; $('#pinbtn').hidden = true;
  $('#note').hidden = true;
  $('#msgs').innerHTML = '<div class="empty"><span class="clawd"></span><h2>What are we working on?</h2><div>Type below. Replies show up here as messages, and the code stays hidden.</div></div>';
  drawThreads(); updateSend(); $('#input').focus();
}
$('#newchat').onclick = () => { document.body.classList.remove('sideopen'); newChat(); };

/* ---------- composer ---------- */
const input = $('#input');
function updateSend(){ $('#send').disabled = !input.value.trim() || !!(thread && thread.working); }
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 220) + 'px'; updateSend(); });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendMsg(); } });
$('#send').onclick = sendMsg;
async function sendMsg(){
  const text = input.value.trim();
  if (!text || (thread && thread.working)) return;
  $('#send').disabled = true;
  const r = await api('/api/send', {id: current, text});
  if (r.error){ toast(r.error); updateSend(); return; }
  input.value = ''; input.style.height = 'auto';
  const wasNew = !current;
  current = r.id; store.set('current', r.id);
  // show the message right away; the transcript catches up a moment later
  if (wasNew) $('#msgs').innerHTML = '';
  const box = $('#msgs');
  box.querySelector('.empty')?.remove();
  box.appendChild(bubbleMe({text, ts: Date.now()/1000}));
  const t = document.createElement('div'); t.className = 'typing';
  t.innerHTML = '<div class="av"><span class="clawd"></span></div><span class="dots"><span></span><span></span><span></span></span><span>Working…</span>';
  box.appendChild(t);
  $('#scroll').scrollTop = $('#scroll').scrollHeight;
  if (!thread) thread = {working: true, items: [], title: 'New chat', cwd: '', pending_steps: 0};
  thread.working = true;
  lastVersion = -2;
  setTimeout(async () => { await refreshThread(true); loadThreads(); }, 1500);
}

/* ---------- agent drawer ---------- */
async function openAgent(it){
  agentOpen = it;
  $('#dtitle').textContent = it.description;
  $('#dsub').textContent = 'Agent · ' + it.type;
  $('#dmsgs').innerHTML = '<div class="empty">Loading…</div>';
  $('#drawer').classList.add('open');
  await refreshAgent(true);
}
async function refreshAgent(first){
  clearTimeout(agentT);
  if (!agentOpen || !current) return;
  const r = await api('/api/agent?id=' + current + '&agent=' + agentOpen.agent_id);
  if (!agentOpen) return;
  const box = $('#dmsgs');
  const keep = first || box.scrollHeight - box.scrollTop - box.clientHeight < 160;
  box.innerHTML = '';
  if (r.error){ box.innerHTML = '<div class="empty">Couldn’t load this agent.</div>'; return; }
  $('#dsub').textContent = 'Agent · ' + r.type + ' · ' + (r.active ? 'running now' : 'done');
  let firstUser = true;
  for (const it of r.items){
    if (it.kind === 'user'){
      if (firstUser){ const l = document.createElement('div'); l.className = 'label'; l.textContent = 'The job it was given'; box.appendChild(l); firstUser = false; }
      box.appendChild(bubbleMe(it));
    } else if (it.kind === 'claude') box.appendChild(bubbleClaude(it));
    else if (it.kind === 'work'){ const w = document.createElement('div'); w.className = 'work'; w.style.marginLeft = '44px'; w.textContent = 'worked · ' + it.n + ' steps'; box.appendChild(w); }
  }
  if (r.active){
    const t = document.createElement('div'); t.className = 'typing';
    t.innerHTML = '<div class="av"><span class="clawd"></span></div><span class="dots"><span></span><span></span><span></span></span><span>Working' + (r.pending_steps ? ' · ' + r.pending_steps + ' steps' : '') + '</span>';
    box.appendChild(t);
    agentT = setTimeout(() => refreshAgent(false), 3000);
  }
  if (keep) box.scrollTop = box.scrollHeight;
}
$('#dclose').onclick = () => { agentOpen = null; clearTimeout(agentT); $('#drawer').classList.remove('open'); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && agentOpen) $('#dclose').click();
  if ((e.metaKey || e.ctrlKey) && e.key === 'k'){ e.preventDefault(); $('#q').focus(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'n'){ e.preventDefault(); newChat(); }
});

/* ---------- lifecycle ---------- */
function scheduleList(){
  clearTimeout(listT);
  listT = setTimeout(async () => { if (!document.hidden) await loadThreads(); scheduleList(); }, 20000);
}
window.addEventListener('focus', () => { loadThreads(); if (current) refreshThread(false); });
setInterval(() => fetch('/alive').catch(()=>{}), 60000);
(async () => {
  await loadThreads();
  const last = new URLSearchParams(location.search).get('thread') || store.get('current', null);
  if (last && threads.some(t => t.id === last)) openThread(last);
  else newChat();
  scheduleList();
})();
</script>
</body>
